name: Build Switch 1 & 2 NROs

on: [ push, pull_request, workflow_dispatch ]

jobs:
  build_nros:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies & git
      run: |
        # The devkitPro image already ships these. Only talk to devkitPro's
        # package server (which often refuses CI runners) if one is missing.
        missing=""
        for pkg in switch-sdl2 switch-openal-soft switch-mesa switch-libdrm_nouveau switch-glad switch-libvorbis switch-libogg switch-libmad switch-libjpeg-turbo switch-curl switch-mbedtls switch-zlib; do
          dkp-pacman -Q "$pkg" >/dev/null 2>&1 || missing="$missing $pkg"
        done
        if [ -n "$missing" ]; then
          dkp-pacman -Sy --noconfirm --needed $missing
        fi
        command -v git >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends git ca-certificates)

    - name: Get short SHA
      id: slug
      run: |
        printf '%s\n' "sha8=$(printf '%s\n' ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Build OpenArenaNX and Quake3NX (Switch 1)
      run: |
        make -f Makefile.nx -j$(nproc)
        make -f Makefile.nx -j$(nproc) GAME=quake3

    - name: Push Switch 1 NRO artifact
      uses: actions/upload-artifact@v4
      with:
        name: switch1-nros_${{ steps.slug.outputs.sha8 }}
        path: |
          OpenArenaNX.nro
          Quake3NX.nro
        if-no-files-found: error

    # The Switch 2 build comes second so that a problem with its SDK never
    # costs the Switch 1 NROs above.
    - name: Install Ounce SDK
      run: |
        git clone https://github.com/ouncebrew/ounce-devkit.git /tmp/ounce-devkit
        cd /tmp/ounce-devkit
        # the installer syncs with devkitPro's package server, which turns
        # CI runners away now and then; give it a few tries
        for attempt in 1 2 3 4 5; do
          sh install.sh && exit 0
          echo "Ounce SDK install failed (attempt $attempt), retrying in 30s"
          sleep 30
        done
        exit 1

    - name: Build OpenArenaNX and Quake3NX (Switch 2)
      run: |
        make -f Makefile.nx2 -j$(nproc)
        make -f Makefile.nx2 -j$(nproc) GAME=quake3

    - name: Push Switch 2 NRO artifact
      uses: actions/upload-artifact@v4
      with:
        name: switch2-nros_${{ steps.slug.outputs.sha8 }}
        path: |
          OpenArenaNX_Switch2.nro
          Quake3NX_Switch2.nro
        if-no-files-found: error
